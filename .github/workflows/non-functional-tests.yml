
name: Non-Functional Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prototype-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tests/non-functional

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run non-functional tests
        run: go test -v ./...

      - name: Run race detector
        run: go test -race ./...
